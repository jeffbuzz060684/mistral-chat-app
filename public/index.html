<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Mistral</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: system-ui, sans-serif; display: flex; justify-content: center; background: #f4f4f7; }
    main { width: 100%; max-width: 640px; height: 100vh; display: flex; flex-direction: column; background: #fff; }
    h1 { font-size: 1.1rem; padding: 1rem; border-bottom: 1px solid #e2e2e6; }
    #chat { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .msg { padding: 0.5rem 0.75rem; border-radius: 10px; max-width: 80%; white-space: pre-wrap; }
    .user { align-self: flex-end; background: #ff8200; color: #fff; }
    .bot { align-self: flex-start; background: #ececf1; }
    form { display: flex; gap: 0.5rem; padding: 1rem; border-top: 1px solid #e2e2e6; }
    input { flex: 1; padding: 0.6rem; border: 1px solid #d4d4da; border-radius: 8px; }
    button { padding: 0.6rem 1.2rem; border: none; border-radius: 8px; background: #ff8200; color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    p.error { color: #c00; font-size: 0.85rem; padding: 0 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>Chat Mistral</h1>
    <div id="chat"></div>
    <p id="error" class="error"></p>
    <form id="form">
      <input id="input" placeholder="Écrivez votre message…" autocomplete="off" required />
      <button id="send" type="submit">Envoyer</button>
    </form>
  </main>
  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const errorEl = document.getElementById("error");
    const messages = [];

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + (role === "user" ? "user" : "bot");
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      send.disabled = true;
      errorEl.textContent = "";
      messages.push({ role: "user", content: text });
      addMessage("user", text);
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Erreur serveur");
        messages.push({ role: "assistant", content: data.reply });
        addMessage("assistant", data.reply);
      } catch (err) {
        errorEl.textContent = err.message;
        messages.pop();
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
